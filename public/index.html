<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINEMORA</title>
<style>
:root{--bg:#05070f;--panel:#0b1226;--line:#1c2a4d;--gold:#d4a84b;--txt:#e9e6dc;--mut:#8a93ad}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#10204a,var(--bg));color:var(--txt);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:40px 18px}
h1{font-weight:400;font-size:clamp(34px,8vw,56px);letter-spacing:.04em;margin:0;color:var(--gold)}
p.sub{color:var(--mut);margin:6px 0 28px}
textarea,select,button{width:100%;font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;margin:10px 0}
button{background:var(--gold);color:#1a1405;border:0;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#bar{height:6px;background:var(--line);border-radius:3px;margin-top:22px;overflow:hidden;display:none}
#fill{height:100%;width:0;background:var(--gold);transition:width .6s}
#msg{margin-top:10px;color:var(--mut);min-height:22px}
#msg.err{color:#ff8a7a}
video{width:100%;max-height:70vh;margin-top:18px;border-radius:6px;background:#000;display:none}
a.dl{display:none;margin-top:12px;color:var(--gold)}
</style></head><body><main>
<h1>CINEMORA</h1>
<p class="sub">Ek prompt likho. Script, images, voiceover aur edit apne aap ho jayega.</p>
<textarea id="p" placeholder="Jaise: Ek chhote gaon ke ladke ki ISRO scientist banne ki kahani"></textarea>
<div class="row">
<select id="l"><option value="hi">Hindi voice</option><option value="en">English voice</option></select>
<select id="f"><option value="9:16">Reels / Shorts (9:16)</option><option value="16:9">YouTube (16:9)</option></select>
</div>
<button id="go">Video banao</button>
<div id="bar"><div id="fill"></div></div>
<div id="msg" role="status"></div>
<video id="v" controls playsinline></video>
<a class="dl" id="dl" download>MP4 download karo</a>
</main>
<script>
const $=id=>document.getElementById(id);
$('go').onclick=async()=>{
  const prompt=$('p').value.trim();
  if(prompt.length<3){$('msg').textContent='Pehle prompt likho.';return}
  $('go').disabled=true;$('v').style.display=$('dl').style.display='none';
  $('bar').style.display='block';$('fill').style.width='2%';$('msg').className='';$('msg').textContent='Shuru...';
  try{
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,lang:$('l').value,format:$('f').value})});
    const {id,error}=await r.json(); if(error) throw new Error(error);
    const t=setInterval(async()=>{
      const s=await (await fetch('/api/status/'+id)).json();
      $('fill').style.width=(s.pct||2)+'%'; $('msg').textContent=s.step||'';
      if(s.status==='error'){clearInterval(t);$('msg').className='err';$('msg').textContent='Error: '+s.error;$('go').disabled=false}
      if(s.status==='done'){clearInterval(t);$('go').disabled=false;$('v').src=s.url;$('v').style.display='block';$('dl').href=s.url;$('dl').style.display='inline-block'}
    },2000);
  }catch(e){$('msg').className='err';$('msg').textContent='Error: '+e.message;$('go').disabled=false}
};
</script></body></html>
